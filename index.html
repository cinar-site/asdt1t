<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-posta Doğrulama</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        .msg { margin-top: 15px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

<div class="card">
    <h2>E-posta Doğrulama</h2>
    
    <div id="step1">
        <p>6 haneli kod almak için e-posta adresinizi girin.</p>
        <input type="email" id="emailInput" placeholder="ornek@gmail.com" required>
        <button onclick="sendCode()">Kod Gönder</button>
    </div>

    <div id="step2" class="hidden">
        <p>E-postanıza gelen 6 haneli kodu girin.</p>
        <input type="text" id="codeInput" placeholder="------" maxlength="6">
        <button onclick="verifyCode()">Kodu Doğrula</button>
    </div>

    <div id="message" class="msg"></div>
</div>

<script>
    // BURAYA RENDER'IN SANA VERDİĞİ LİNKİ YAPIŞTIR kanka
    const serverUrl = 'https://asdt1t.onrender.com'; 
    let userEmail = '';

    async function sendCode() {
        userEmail = document.getElementById('emailInput').value;
        if(!userEmail) return alert('Lütfen e-posta girin!');

        document.getElementById('message').innerText = 'Kod gönderiliyor...';

        const res = await fetch(`${serverUrl}/send-code`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: userEmail })
        });
        const data = await res.json();
        
        if(res.ok) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('message').innerText = 'Kod başarıyla gönderildi!';
        } else {
            alert(data.error || 'Bir hata oluştu.');
        }
    }

    async function verifyCode() {
        const code = document.getElementById('codeInput').value;
        if(code.length !== 6) return alert('Kod 6 haneli olmalıdır!');

        const res = await fetch(`${serverUrl}/verify-code`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: userEmail, code: code })
        });
        const data = await res.json();

        if(res.ok) {
            document.getElementById('message').innerText = 'Giriş Başarılı! E-posta doğrulandı.';
            document.getElementById('message').style.color = '#28a745';
        } else {
            document.getElementById('message').innerText = 'Hatalı veya süresi dolmuş kod!';
            document.getElementById('message').style.color = '#dc3545';
        }
    }
</script>
</body>
</html>
